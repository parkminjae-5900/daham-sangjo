<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윤상아 | 다함상조</title>
<meta property="og:title" content="윤상아 | 다함상조 의전팀장">
<meta property="og:description" content="6년차 · 다함상조">
<style>
:root{
  --blue:#4067f2;--ink:#15171b;--muted:#8a8f98;--line:#eceff3;
  --card:#fff;--bg:#fff;--chip:#f7f8fa;--shadow:0 6px 22px rgba(22,34,66,.06)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
a{text-decoration:none;color:inherit}
button{font:inherit}
.slice-page{width:min(430px,100%);margin:0 auto;background:#fff;min-height:100vh}
.cover{padding:20px 16px 0}
.cover img{display:block;width:100%;aspect-ratio:1.58/1;border-radius:0;object-fit:cover;object-position:center 20%;background:#eee}
.identity{text-align:center;padding:20px 18px 8px}
.identity h1{font-size:28px;line-height:1.2;margin:0 0 14px;font-weight:800;letter-spacing:-.5px}
.company{display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;color:#3e4248;margin-bottom:12px}
.logo-dot{width:18px;height:18px;border-radius:6px;border:2px solid #6c7080;display:grid;place-items:center;font-size:10px;font-weight:900}
.position{font-size:15px;color:#666b73;margin-bottom:12px}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:9px;background:var(--chip);font-size:12px;color:#424750;border:1px solid #f0f1f3}

.section{padding:18px 16px 0}
.section h2{font-size:20px;margin:0 0 14px;font-weight:800;letter-spacing:-.2px}
.info-card{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.info-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;min-height:62px;padding:0 15px;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0}
.icon{font-size:20px;color:#20242a;text-align:center}
.info-text{min-width:0}
.info-main{font-size:15px;color:#21242a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info-sub{font-size:12px;color:var(--muted);margin-top:4px}
.info-action{font-size:12px;font-weight:800;color:var(--blue);border:0;background:#fff;cursor:pointer;padding:8px}

.intro{font-size:15px;line-height:1.85;color:#30343a;padding:2px 2px 0}
.photo-block img{width:100%;display:block;border-radius:12px;aspect-ratio:1.55/1;object-fit:cover;object-position:center 20%;background:#eee}

.kakao-box{border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;align-items:center;gap:12px}
.kakao-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fee500;font-size:19px;font-weight:900}
.kakao-text{flex:1}
.kakao-title{font-size:15px;font-weight:800;margin-bottom:3px}
.kakao-sub{font-size:12px;color:var(--muted)}
.kakao-link{font-size:12px;color:var(--blue);font-weight:800}

.sharebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px 16px 26px}
.sharebtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font-size:13px;font-weight:800;cursor:pointer}
.sharebtn.primary{background:#111827;color:#fff;border-color:#111827}

.directory{max-width:1120px;margin:auto;padding:24px 16px 40px;background:#f6f7f9;min-height:100vh}
.dir-head{background:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.dir-head h1{margin:0 0 5px;font-size:28px}.dir-head p{margin:0;color:#7d838c}
.search{width:100%;margin-top:14px;border:1px solid #dde2e8;border-radius:12px;padding:13px 14px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.staff-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.staff-card img{width:100%;aspect-ratio:1.58/1;object-fit:cover;object-position:center 20%;display:block}
.staff-meta{padding:13px 14px 15px}.staff-meta b{display:block;font-size:18px;margin-bottom:5px}.staff-meta span{font-size:12px;color:#676d76}
.footer{text-align:center;color:#8a9099;font-size:12px;margin-top:22px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.cover{padding:14px 10px 0}.section{padding-left:14px;padding-right:14px}.identity{padding-left:14px;padding-right:14px}.grid{gap:9px}.directory{padding:12px 9px 28px}}
</style></head><body>
